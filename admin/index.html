<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>評評狸 · 後台管理</title>
<style>
  :root { --bg:#141110; --surface:#221d1b; --surface2:#2e2724; --text:#f2ece9; --sub:#9b8e87; --brand:#e8833a; --danger:#e5544b; --ok:#3fa372; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; }
  a { color:var(--brand); }
  .wrap { max-width:860px; margin:0 auto; padding:18px; }
  header { display:flex; align-items:center; gap:10px; padding:14px 18px; position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--surface2); z-index:10; }
  header .logo { width:34px;height:34px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;color:#141110; }
  header h1 { font-size:17px; margin:0; flex:1; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:9px 14px; background:var(--surface2); color:var(--text); }
  button.primary { background:var(--brand); color:#141110; font-weight:700; }
  button.danger { background:rgba(229,84,75,.16); color:var(--danger); font-weight:700; }
  button.ghost { background:transparent; color:var(--sub); }
  button:disabled { opacity:.5; cursor:default; }
  input, select { font:inherit; background:var(--surface2); color:var(--text); border:1px solid #3a322e; border-radius:10px; padding:9px 11px; width:100%; }
  label { font-size:12px; color:var(--sub); display:block; margin:10px 0 4px; }
  .card { background:var(--surface); border:1px solid var(--surface2); border-radius:14px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--surface2); color:var(--sub); }
  .pill.warn { background:rgba(229,84,75,.16); color:var(--danger); }
  .pill.ok { background:rgba(63,163,114,.16); color:var(--ok); }
  .tabs { display:flex; gap:6px; padding:10px 18px 0; flex-wrap:wrap; }
  .tabs button.active { background:var(--brand); color:#141110; font-weight:700; }
  .muted { color:var(--sub); font-size:13px; }
  .hidden { display:none; }
  h2 { font-size:15px; margin:4px 0 10px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--surface2); padding:10px 16px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.4); opacity:0; transition:.25s; }
  .toast.show { opacity:1; }
  .empty { text-align:center; color:var(--sub); padding:30px 0; }
  .grow { flex:1; min-width:120px; }
  .drop { border:1.5px dashed #4a403b; border-radius:12px; padding:22px; text-align:center; color:var(--sub); cursor:pointer; transition:.15s; margin-top:4px; }
  .drop.over { border-color:var(--brand); background:rgba(232,131,58,.08); color:var(--brand); }
  .preview { max-height:140px; margin-top:10px; border-radius:10px; display:block; border:1px solid var(--surface2); }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="login" class="wrap" style="max-width:380px;margin-top:12vh;">
  <div style="text-align:center;margin-bottom:18px;">
    <div class="logo" style="width:60px;height:60px;border-radius:16px;font-size:26px;margin:0 auto 12px;">狸</div>
    <h1 style="margin:0;">評評狸 · 後台管理</h1>
    <p class="muted">用管理員帳號登入</p>
  </div>
  <div class="card">
    <label>Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="admin@example.com" />
    <label>密碼</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
    <button class="primary" style="width:100%;margin-top:14px;" onclick="doLogin()">登入</button>
    <p id="loginErr" class="muted" style="color:var(--danger);"></p>
  </div>
</div>

<!-- 管理畫面 -->
<div id="app" class="hidden">
  <header>
    <div class="logo">狸</div>
    <h1>後台管理</h1>
    <span id="who" class="muted"></span>
    <button class="ghost" onclick="doLogout()">登出</button>
  </header>
  <div id="health-banner" style="display:none"></div>
  <div class="tabs">
    <button data-tab="dashboard" class="active" onclick="switchTab('dashboard')">儀表板</button>
    <button data-tab="retention" onclick="switchTab('retention')">📊 留存</button>
    <button data-tab="reports" onclick="switchTab('reports')">檢舉審核</button>
    <button data-tab="moderation" onclick="switchTab('moderation')">留言審核</button>
    <button data-tab="userlookup" onclick="switchTab('userlookup')">用戶查詢</button>
    <button data-tab="data" onclick="switchTab('data')">內容管理</button>
    <button data-tab="news" onclick="switchTab('news')">狸聞</button>
    <button data-tab="broadcast" onclick="switchTab('broadcast')">公告</button>
    <button data-tab="automation" onclick="switchTab('automation')">自動化</button>
    <button data-tab="bans" onclick="switchTab('bans')">封禁管理</button>
    <button data-tab="roles" onclick="switchTab('roles')">權限</button>
    <button data-tab="assets" onclick="switchTab('assets')">設計資源</button>
    <button data-tab="boards" onclick="switchTab('boards')">板塊管理</button>
  </div>
  <div class="wrap">
    <section id="tab-dashboard"></section>
    <section id="tab-retention" class="hidden"></section>
    <section id="tab-reports" class="hidden"></section>
    <section id="tab-moderation" class="hidden"></section>
    <section id="tab-userlookup" class="hidden"></section>
    <section id="tab-data" class="hidden"></section>
    <section id="tab-news" class="hidden"></section>
    <section id="tab-broadcast" class="hidden"></section>
    <section id="tab-automation" class="hidden"></section>
    <section id="tab-bans" class="hidden"></section>
    <section id="tab-roles" class="hidden"></section>
    <section id="tab-assets" class="hidden"></section>
    <section id="tab-boards" class="hidden"></section>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---- 設定（publishable key 是 client 安全的；後台靠「管理員登入 + 權限規則」授權，不放任何祕密金鑰）----
const SUPABASE_URL = "https://zhddqdfbzypvvyqmqxif.supabase.co";
const SUPABASE_KEY = "sb_publishable_vpoHuAaAFtqZkCpiTrq7Eg_8v1uhUUA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const REASON = { spam:"垃圾/廣告", harass:"騷擾/辱罵", sexual:"色情/不當", hate:"仇恨言論", other:"其他" };
const $ = (s)=>document.querySelector(s);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
function esc(s){ return (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function short(id){ return id ? "JR"+id.slice(0,6) : "—"; }

// ---- 登入 ----
async function doLogin(){
  $("#loginErr").textContent="";
  const email=$("#email").value.trim(), password=$("#password").value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $("#loginErr").textContent="登入失敗："+error.message; return; }
  await afterLogin(data.user);
}
async function afterLogin(user){
  const { data:prof } = await sb.from("profiles").select("is_admin,display_name").eq("id",user.id).single();
  if(!prof || !prof.is_admin){
    $("#loginErr").textContent="這個帳號不是管理員（需先把 is_admin 設成 true）。";
    await sb.auth.signOut(); return;
  }
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#who").textContent = (prof.display_name||user.email);
  loadDashboard();
  loadHealthBanner();                       // 全域告警橫幅（所有分頁可見）
  setInterval(loadHealthBanner, 60000);     // 每分鐘自動刷新
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

// ---- 分頁 ----
function switchTab(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab===t));
  ["dashboard","retention","reports","moderation","userlookup","data","news","broadcast","automation","bans","roles","assets","boards"].forEach(x=>$("#tab-"+x).classList.toggle("hidden", x!==t));
  ({dashboard:loadDashboard, retention:loadRetention, reports:loadReports, moderation:loadModeration, userlookup:loadUserLookup, data:loadData, news:loadNews, broadcast:loadBroadcast, automation:loadAutomation, bans:loadBans, roles:loadRoles, assets:loadAssets, boards:loadBoards})[t]();
}

// ---- 儀表板（數據總覽）----
async function loadDashboard(){
  const el=$("#tab-dashboard"); el.innerHTML='<p class="muted">載入中…</p>';
  const today = new Date(); today.setHours(0,0,0,0);
  const todayISO = today.toISOString(), nowISO = new Date().toISOString();
  async function cnt(table, filt){
    let q = sb.from(table).select("*", { count:"exact", head:true });
    if(filt) q = filt(q);
    const { count, error } = await q;
    return error ? null : count;
  }
  const [realU, botU, todayU, comAll, comToday, ratAll, topAll, banned, annAll] = await Promise.all([
    cnt("profiles", q=>q.eq("is_bot",false)),
    cnt("profiles", q=>q.eq("is_bot",true)),
    cnt("profiles", q=>q.eq("is_bot",false).gte("created_at",todayISO)),
    cnt("comments"),
    cnt("comments", q=>q.gte("created_at",todayISO)),
    cnt("ratings"),
    cnt("topics"),
    cnt("profiles", q=>q.or("ban_permanent.eq.true,banned_until.gt."+nowISO)),
    cnt("announcements"),
  ]);
  const f=(n)=> n==null ? "—" : n.toLocaleString();
  const card=(num,label,sub)=>`<div class="card" style="text-align:center;min-width:140px;flex:1;">
      <div style="font-size:30px;font-weight:800;color:var(--text);line-height:1.1;">${f(num)}</div>
      <div class="muted" style="font-size:13px;margin-top:4px;">${label}</div>
      ${sub?`<div class="muted" style="font-size:11px;">${sub}</div>`:""}</div>`;
  el.innerHTML = `<h2>數據總覽</h2>
    <div class="row" style="flex-wrap:wrap;gap:10px;">
      ${card(realU,"真人用戶", botU!=null?`機器人 ${f(botU)}`:"")}
      ${card(todayU,"今日新增真人")}
      ${card(banned,"目前封禁中")}
      ${card(topAll,"總話題")}
      ${card(comAll,"總留言", comToday!=null?`今日 +${f(comToday)}`:"")}
      ${card(ratAll,"總評分")}
      ${card(annAll,"已發公告")}
    </div>
    <p class="muted" style="margin-top:12px;">「真人」＝非機器人帳號；機器人是暖場用的固定人設，留言/評分多由它們產生（總數含機器人）。</p>`;
}

// ---- 留存儀表板（真人 vs 機器人、活躍貢獻留存）----
async function loadRetention(){
  const el=$("#tab-retention"); el.innerHTML='<p class="muted">載入中…（真人資料量小，通常很快）</p>';
  const DAY=86400000;
  const now=new Date();
  function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
  const today=startOfDay(now), todayISO=today.toISOString();
  const d7ISO=new Date(today.getTime()-6*DAY).toISOString();   // 近 7 天（含今天）
  function ageDays(d){ return Math.floor((now - startOfDay(d))/DAY); }

  async function cnt(table, filt){
    let q=sb.from(table).select("*",{count:"exact",head:true});
    if(filt) q=filt(q);
    const {count,error}=await q; return error?null:count;
  }
  // 分頁抓全部，避開 Supabase 單次 1000 列上限
  async function fetchAll(table, cols, build){
    let out=[], from=0; const step=1000;
    for(;;){
      let q=sb.from(table).select(cols).order("created_at",{ascending:true}).range(from, from+step-1);
      if(build) q=build(q);
      const {data,error}=await q;
      if(error){ console.error("fetchAll",table,error); break; }
      out=out.concat(data||[]);
      if(!data || data.length<step) break;
      from+=step;
    }
    return out;
  }

  // 1) 真人名單（is_bot=false）
  const realProfs=await fetchAll("profiles","id,display_name,created_at,is_admin",q=>q.eq("is_bot",false));
  const realIds=realProfs.map(p=>p.id);
  const botU=await cnt("profiles",q=>q.eq("is_bot",true));
  if(realIds.length===0){
    el.innerHTML='<h2>留存儀表板</h2><p class="empty">目前還沒有真人帳號（is_bot=false）。機器人 '+(botU||0)+' 隻。等真人註冊後，這裡會自動顯示真人留存與真人 vs 機器人貢獻占比。</p>';
    return;
  }
  // 切塊（in() 一次別塞太多 id）
  const chunks=[]; for(let i=0;i<realIds.length;i+=150) chunks.push(realIds.slice(i,i+150));

  // 2) 全站 vs 真人 貢獻數（head count）
  async function realCount(table,col,extra){
    let s=0; for(const ch of chunks){ s+=(await cnt(table,q=>{q=q.in(col,ch); return extra?extra(q):q;}))||0; } return s;
  }
  const [ratTotal,comTotal,topTotal,ratReal,comReal,topReal]=await Promise.all([
    cnt("ratings"),
    cnt("comments"),
    cnt("topics",q=>q.eq("type","user_topic")),
    realCount("ratings","user_id"),
    realCount("comments","user_id"),
    realCount("topics","created_by",q=>q.eq("type","user_topic")),
  ]);

  // 3) 真人活動列（評分/留言/發帖）
  async function gather(table,cols,col,extra){
    let o=[]; for(const ch of chunks){ o=o.concat(await fetchAll(table,cols,q=>{q=q.in(col,ch); return extra?extra(q):q;})); } return o;
  }
  const [rRows,cRows,tRows]=await Promise.all([
    gather("ratings","user_id,created_at","user_id"),
    gather("comments","user_id,created_at,body,target_id","user_id"),
    gather("topics","created_by,created_at,title","created_by",q=>q.eq("type","user_topic")),
  ]);
  // P0 唯一指標之一：真人「自發評分率/留言率」＝有評過分（留過言）的真人 ÷ 全部真人（回答「進來的真人買不買單」）
  const raters=new Set(rRows.map(r=>r.user_id)).size, commenters=new Set(cRows.map(c=>c.user_id)).size;

  // 4) 每位真人：註冊日 + 活動日 offset 集合
  const U={}; realProfs.forEach(p=>{ U[p.id]={name:p.display_name, signup:new Date(p.created_at), days:new Set(), odays:new Set(), acts:0, admin:p.is_admin}; });
  const actToday=new Set(), act7=new Set();
  function addAct(uid,ts){ const u=U[uid]; if(!u)return; u.acts++; u.days.add(Math.floor((new Date(ts)-startOfDay(u.signup))/DAY)); if(ts>=todayISO)actToday.add(uid); if(ts>=d7ISO)act7.add(uid); }
  rRows.forEach(r=>addAct(r.user_id,r.created_at));
  cRows.forEach(c=>addAct(c.user_id,c.created_at));
  tRows.forEach(t=>addAct(t.created_by,t.created_at));

  // 4.5) 開啟事件（app_opens）：每位真人的「開啟日 offset」集合＝量開啟留存（含只看不互動的回訪）
  const openToday=new Set(), open7=new Set();
  { let opens=[];
    for(const ch of chunks){
      let from=0; const step=1000;
      for(;;){
        const {data,error}=await sb.from("app_opens").select("user_id,day").in("user_id",ch).order("day",{ascending:true}).range(from,from+step-1);
        if(error){ console.error("app_opens",error); break; }
        opens=opens.concat(data||[]);
        if(!data||data.length<step) break;
        from+=step;
      }
    }
    opens.forEach(o=>{ const u=U[o.user_id]; if(!u)return;
      const dd=startOfDay(new Date(o.day+"T00:00:00"));
      u.odays.add(Math.floor((dd-startOfDay(u.signup))/DAY));
      const iso=dd.toISOString(); if(iso>=todayISO)openToday.add(o.user_id); if(iso>=d7ISO)open7.add(o.user_id);
    });
  }

  const arr=Object.values(U);
  const admins=arr.filter(u=>u.admin).length;
  const contributors=arr.filter(u=>u.acts>0).length;
  const lurkers=arr.length-contributors;
  const newToday=arr.filter(u=>ageDays(u.signup)===0).length;

  // 5) cohort（按註冊週一）
  function weekKey(d){ const x=startOfDay(d); const off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); return x.toISOString().slice(0,10); }
  const cohorts={}; arr.forEach(u=>{ (cohorts[weekKey(u.signup)]=cohorts[weekKey(u.signup)]||[]).push(u); });
  function retN(users,N){
    const elig=users.filter(u=>ageDays(u.signup)>=N);
    if(elig.length===0) return '<span class="muted">—</span>';
    const ret=elig.filter(u=>[...u.days].some(d=>d>=N)).length;
    const pct=Math.round(100*ret/elig.length);
    const col= pct>=15?'var(--ok)': pct>0?'var(--text)':'var(--muted)';
    return `<span style="color:${col};font-weight:700;">${pct}%</span> <span class="muted" style="font-size:11px;">${ret}/${elig.length}</span>`;
  }
  // 開啟留存：註冊第 N 天（含）以後是否還「開過 App」（不需互動）
  function retOpen(users,N){
    const elig=users.filter(u=>ageDays(u.signup)>=N);
    if(elig.length===0) return '<span class="muted">—</span>';
    const ret=elig.filter(u=>[...u.odays].some(d=>d>=N)).length;
    const pct=Math.round(100*ret/elig.length);
    const col= pct>=15?'var(--ok)': pct>0?'var(--text)':'var(--muted)';
    return `<span style="color:${col};font-weight:700;">${pct}%</span> <span class="muted" style="font-size:11px;">${ret}/${elig.length}</span>`;
  }

  // ---- 渲染 ----
  const f=n=> n==null?"—":n.toLocaleString();
  const pc=(a,b)=> (b&&b>0)? Math.round(100*a/b)+"%" : "—";
  const card=(num,label,sub)=>`<div class="card" style="text-align:center;min-width:120px;flex:1;">
      <div style="font-size:28px;font-weight:800;color:var(--text);line-height:1.1;">${num}</div>
      <div class="muted" style="font-size:13px;margin-top:4px;">${label}</div>
      ${sub?`<div class="muted" style="font-size:11px;">${sub}</div>`:""}</div>`;

  const cohortRows=Object.keys(cohorts).sort().reverse().map(k=>{
    const us=cohorts[k];
    return `<tr><td style="padding:6px 10px;">${k} 那週</td>
      <td style="text-align:center;">${us.length}</td>
      <td style="text-align:center;">${retN(us,1)}</td>
      <td style="text-align:center;">${retN(us,7)}</td>
      <td style="text-align:center;">${retN(us,30)}</td></tr>`;
  }).join("") || `<tr><td colspan="5" class="muted" style="padding:8px 10px;">尚無資料</td></tr>`;

  const openCohortRows=Object.keys(cohorts).sort().reverse().map(k=>{
    const us=cohorts[k];
    return `<tr><td style="padding:6px 10px;">${k} 那週</td>
      <td style="text-align:center;">${us.length}</td>
      <td style="text-align:center;">${retOpen(us,1)}</td>
      <td style="text-align:center;">${retOpen(us,7)}</td>
      <td style="text-align:center;">${retOpen(us,30)}</td></tr>`;
  }).join("") || `<tr><td colspan="5" class="muted" style="padding:8px 10px;">尚無資料</td></tr>`;

  const nameOf={}; realProfs.forEach(p=>nameOf[p.id]=p.display_name);
  const feed=[
    ...cRows.map(c=>({uid:c.user_id, ts:c.created_at, kind:'💬留言', text:(c.body||'(圖片)')})),
    ...tRows.map(t=>({uid:t.created_by, ts:t.created_at, kind:'📝發帖', text:(t.title||'(無標題)')})),
  ].sort((a,b)=> a.ts<b.ts?1:-1).slice(0,25).map(x=>`
    <div style="padding:7px 0;border-bottom:1px solid var(--line);">
      <span class="pill ok">真人</span> <b style="color:var(--text);">${esc(nameOf[x.uid]||'?')}</b>
      <span class="muted" style="font-size:11px;">${x.kind} · ${new Date(x.ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
      <div style="color:var(--text);font-size:13px;margin-top:2px;">${esc((x.text||'').slice(0,80))}</div>
    </div>`).join("") || '<p class="muted">尚無真人留言/發帖。</p>';

  el.innerHTML=`<h2>留存儀表板 <span class="muted" style="font-size:13px;font-weight:400;">真人才是真相，機器人只是佈景</span></h2>

    <h3 style="margin:6px 0;">真人總覽</h3>
    <div class="row" style="flex-wrap:wrap;gap:10px;">
      ${card(f(arr.length),"真人帳號", admins?`含管理員 ${admins}`:"")}
      ${card(f(contributors),"有貢獻過", `潛水 ${f(lurkers)}（只註冊0互動）`)}
      ${card(f(actToday.size),"今日活躍真人")}
      ${card(f(act7.size),"近 7 天活躍真人")}
      ${card(f(newToday),"今日新增真人")}
      ${card(pc(contributors,arr.length),"真人貢獻率", "有互動 / 全部真人")}
      ${card(pc(raters,arr.length),"自發評分率", `評過分 ${f(raters)} 人 / 全部真人`)}

// ---- 檢舉審核 ----
async function loadReports(){
  const el=$("#tab-reports"); el.innerHTML='<p class="muted">載入中…</p>';
  // 待處理與已處理分開查，避免踩 Supabase 單次 1000 列上限把舊的 pending 靜默截掉（待處理先進先出、最舊在上）。
  const { data:pend, error:e1 } = await sb.from("reports").select("*").eq("status","pending").order("created_at",{ascending:true}).limit(1000);
  const { data:done, error:e2 } = await sb.from("reports").select("*").neq("status","pending").order("created_at",{ascending:false}).limit(30);
  if(e1||e2){ el.innerHTML='<p class="empty">讀取失敗：'+esc((e1||e2).message)+'</p>'; return; }
  const reports=[...(pend||[]), ...(done||[])];
  // 抓被檢舉留言的內容 + 被檢舉話題的標題
  const cids=[...new Set(reports.filter(r=>r.target_type==="comment").map(r=>r.target_id))];
  let bodies={};
  if(cids.length){ const {data:cs}=await sb.from("comments").select("id,body").in("id",cids); (cs||[]).forEach(c=>bodies[c.id]=c.body); }
  const tids=[...new Set(reports.filter(r=>r.target_type==="topic").map(r=>r.target_id))];
  let topicTitles={};
  if(tids.length){ const {data:ts}=await sb.from("topics").select("id,title").in("id",tids); (ts||[]).forEach(t=>topicTitles[t.id]=t.title); }
  const capHit=(pend||[]).length>=1000;
  el.innerHTML = `<h2>待處理 ${(pend||[]).length}${capHit?'+':''} 件 · 另列最近 ${(done||[]).length} 件已處理</h2>`
    + (capHit?'<p class="muted" style="color:var(--danger)">⚠️ 待處理已達 1000 上限，請盡快清理</p>':'')
    + (reports.length? reports.map(r=>{
    const isComment = r.target_type==="comment";
    const commentExists = isComment && bodies[r.target_id]!==undefined;
    const body = isComment ? (bodies[r.target_id] ?? "（留言已刪除）")
               : r.target_type==="topic"   ? ("話題："+(topicTitles[r.target_id] ?? "（已刪除）"))
               : "（檢舉使用者）";
    const st = r.status==="pending"?'<span class="pill warn">待處理</span>': r.status==="actioned"?'<span class="pill ok">已處理</span>':'<span class="pill">已忽略</span>';
    return `<div class="card">
      <div class="row"><span class="pill">${REASON[r.reason]||r.reason}</span>${st}<span class="muted">${new Date(r.created_at).toLocaleString()}</span></div>
      <p style="margin:8px 0;">${esc(body)}</p>
      <p class="muted">被檢舉者：${short(r.reported_user)} · 檢舉者：${short(r.reporter_id)}</p>
      <div class="row" style="margin-top:6px;">
        ${commentExists?`<button class="danger" onclick="deleteReportedComment('${r.target_id}','${r.id}')">🗑 刪除留言</button>`:""}
        <button class="danger" onclick="banFromReport('${r.reported_user}','${r.id}',7)">封 7 天</button>
        <button class="danger" onclick="banFromReport('${r.reported_user}','${r.id}',30)">封 30 天</button>
        <button class="danger" onclick="banFromReport('${r.reported_user}','${r.id}',0)">永久封禁</button>
        <button onclick="setReport('${r.id}','dismissed')">忽略</button>
        <button onclick="setReport('${r.id}','actioned')">標記已處理</button>
      </div></div>`;
  }).join("") : '<p class="empty">目前沒有檢舉 🎉</p>');
}
async function deleteReportedComment(cid, reportId){
  if(!confirm("刪除這則被檢舉的留言？")) return;
  const { error } = await sb.rpc("admin_delete_comment",{ cid });
  if(error){ toast("刪除失敗："+error.message); return; }
  await sb.rpc("admin_set_report_status",{ report:reportId, new_status:"actioned" });
  toast("已刪除留言並標記處理"); loadReports();
}
async function banFromReport(uid, reportId, days){
  if(!uid || uid==="null"){ toast("這筆沒有被檢舉者 id"); return; }
  if(!confirm(days? `封禁此使用者 ${days} 天？` : "永久封禁此使用者？")) return;
  const until = days ? new Date(Date.now()+days*864e5).toISOString() : null;
  const { error } = await sb.rpc("admin_set_ban",{ target:uid, until, permanent: days===0, reason:"後台依檢舉封禁" });
  if(error){ toast("封禁失敗："+error.message); return; }
  await sb.rpc("admin_set_report_status",{ report:reportId, new_status:"actioned" });
  toast("已封禁並標記處理"); loadReports();
}
async function setReport(id, status){
  const { error } = await sb.rpc("admin_set_report_status",{ report:id, new_status:status });
  if(error){ toast("失敗："+error.message); return; }
  toast("已更新"); loadReports();
}

async function quickBan(uid, days, after){
  if(!uid || uid==="null"){ toast("沒有 user id"); return; }
  if(!confirm(days? `封禁此使用者 ${days} 天？` : "永久封禁此使用者？")) return;
  const until = days ? new Date(Date.now()+days*864e5).toISOString() : null;
  const { error } = await sb.rpc("admin_set_ban",{ target:uid, until, permanent:days===0, reason:"後台處理" });
  if(error){ toast("封禁失敗："+error.message); return; }
  toast("已封禁"); if(after) after();
}

async function fetchMod(){
  const q=$("#mq")?.value.trim()||"";

  // 用 RPC 在 server 端 join profiles 過濾：勾「只看真人」時拉的就是最近 60 則真人留言

}
function renderMod(){

    return `<div class="card">

async function showUser(uid){
  const out=$("#ul-result"); out.innerHTML='<p class="muted">載入中…</p>';
  const [prof, coms, cCnt, rCnt, repCnt] = await Promise.all([
    sb.from("profiles").select("*").eq("id",uid).single(),
    sb.from("comments").select("id,body,created_at,score").eq("user_id",uid).order("created_at",{ascending:false}).limit(15),
    sb.from("comments").select("*",{count:"exact",head:true}).eq("user_id",uid),
    sb.from("ratings").select("*",{count:"exact",head:true}).eq("user_id",uid),
    sb.from("reports").select("*",{count:"exact",head:true}).eq("reported_user",uid),
  ]);
  if(prof.error||!prof.data){ out.innerHTML='<p class="empty">查無此用戶</p>'; return; }
  const p=prof.data;
  const banned = p.ban_permanent || (p.banned_until && new Date(p.banned_until)>new Date());
  const joinDays = Math.max(1, Math.floor((Date.now()-new Date(p.created_at))/864e5)+1);
  out.innerHTML = `<div class="card">
    <div class="row">
      <b style="font-size:18px;color:var(--text)">${esc(p.display_name)}</b>
      ${p.is_admin?'<span class="pill warn">管理員</span>':''}
      ${(p.mod_boards&&p.mod_boards.length)?'<span class="pill">版主</span>':''}
      ${p.is_bot?'<span class="pill">🤖機器人</span>':'<span class="pill ok">真人</span>'}
      ${banned?'<span class="pill warn">已封禁</span>':''}
    </div>
    <p class="muted" style="margin:6px 0;font-size:12px;">${esc(p.id)} · 加入 ${joinDays} 天</p>
    <div class="row"><span class="pill">留言 ${cCnt.count??"—"}</span><span class="pill">評分 ${rCnt.count??"—"}</span><span class="pill">被檢舉 ${repCnt.count??"—"}</span></div>
    <div class="row" style="margin-top:10px;">
      ${banned
        ? `<button onclick="unban('${p.id}');setTimeout(()=>showUser('${p.id}'),400)">解除封禁</button>`
        : `<button class="danger" onclick="quickBan('${p.id}',7,()=>showUser('${p.id}'))">封7天</button>
           <button class="danger" onclick="quickBan('${p.id}',30,()=>showUser('${p.id}'))">封30天</button>
           <button class="danger" onclick="quickBan('${p.id}',0,()=>showUser('${p.id}'))">永久封禁</button>`}
    </div>
    <div class="row" style="margin-top:8px;gap:6px;">
      <input id="rename-input" value="${esc(p.display_name)}" style="flex:1;max-width:220px;">
      <button onclick="adminRename('${p.id}')">改暱稱</button>
      <button class="danger" onclick="adminClearAvatar('${p.id}')">清空頭像</button>
      ${p.is_admin?"":`<button class="danger" onclick="adminDeleteUser('${p.id}')">🗑 刪帳號</button>`}
    </div></div>
  <h2 style="font-size:15px;margin-top:14px;">最近留言（${(coms.data||[]).length}）</h2>
  ${(coms.data&&coms.data.length)? coms.data.map(c=>`<div class="card">
      <p style="margin:0 0 4px;">${esc(c.body||"（圖片留言）")}</p>

        <button class="danger" onclick="delUserComment('${c.id}','${p.id}')">刪除</button></div></div>`).join("")
    : '<p class="empty">沒有留言</p>'}`;

async function uploadAnnImage(file, targetHidden, targetPrev){
  if(!file || !file.type?.startsWith("image/")){ toast("請選擇圖片檔"); return; }
  const ext=((file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,""))||"jpg";
  toast("上傳中…");
  const path=`announcements/a${Date.now()}-${Math.floor(Math.random()*999)}.${ext}`;
  const { error } = await sb.storage.from("app-assets").upload(path, file, { contentType:file.type });
  if(error){ toast("上傳失敗："+error.message); return; }
  const url=sb.storage.from("app-assets").getPublicUrl(path).data.publicUrl;
  $(targetHidden||"#bc_image").value=url;
  const prev=$(targetPrev||"#bc_img_preview");
  if(prev) prev.innerHTML=`<img class="preview" src="${esc(url)}" style="margin-top:8px"/>`;
  toast("圖片已上傳 ✅");
}

function bcSyncPreview(){ const u=$("#bc_image").value.trim(); $("#bc_img_preview").innerHTML = u?`<img class="preview" src="${esc(u)}" style="margin-top:8px"/>`:""; }
async function sendBroadcast(){
  const title=$("#bc_title").value.trim(), body=$("#bc_body").value.trim(), link=$("#bc_link").value.trim();
  const push=$("#bc_push").checked, pinned=$("#bc_pin").checked, image_url=$("#bc_image").value||null;
  const publish_at=fromLocalInput($("#bc_pub").value), expires_at=fromLocalInput($("#bc_exp").value);
  const popup=$("#bc_popup").checked, popup_freq=$("#bc_popupfreq").value;
  if(!title||!body){ toast("請填標題和內文"); return; }
  if(publish_at && expires_at && new Date(expires_at)<=new Date(publish_at)){ toast("下線時間要晚於上線時間"); return; }
  const sched = publish_at && new Date(publish_at)>new Date();
  if(!confirm(`發送公告「${title}」？`+(sched?`（排程 ${new Date(publish_at).toLocaleString()} 上線`+(push?"、到點才推播":"")+"）":(push?"（並推播給所有人）":"（只進通知中心）")))) return;
  $("#bc_status").textContent="發送中…";
  const { data, error } = await sb.functions.invoke("broadcast", { body:{ title, body, link: link||null, image_url, pinned, push, publish_at, expires_at, popup, popup_freq } });
  if(error){ $("#bc_status").textContent=""; toast("發送失敗："+(error.message||error)); return; }
  $("#bc_status").textContent = data.scheduled ? "已排程（到上線時間才出現）" : (push ? `已發送，推播 ${data.sent}/${data.total} 台` : "已發送（未推播）");
  $("#bc_title").value=""; $("#bc_body").value=""; $("#bc_link").value=""; $("#bc_pin").checked=false; $("#bc_pub").value=""; $("#bc_exp").value=""; $("#bc_popup").checked=false; $("#bc_popupfreq").style.display="none"; clearAnnImage();

}

let roleMap = {};        // id -> {is_admin, mod_boards}
let roleBoards = [];     // [{category,title}]
async function loadRoles(){
  const el=$("#tab-roles"); el.innerHTML='<p class="muted">載入中…</p>';
  const [{ data:roles, error }, { data:boards }] = await Promise.all([
    sb.rpc("admin_list_roles"),
    sb.from("boards").select("category,title").order("sort_order"),
  ]);
  if(error){ el.innerHTML='<p class="empty">讀取失敗：'+esc(error.message)+'（權限 SQL 跑了嗎？）</p>'; return; }
  roleBoards = boards||[];
  roleMap = {};
  (roles||[]).forEach(r=>roleMap[r.id]={ is_admin:!!r.is_admin, mod_boards:(r.mod_boards||[]) });
  el.innerHTML = `<h2>管理員與版主</h2>
    <p class="muted">管理員＝全站管理＋後台登入；版主＝App 內可刪自己板塊的話題、封禁用戶。徽章會顯示在 App 暱稱旁。</p>
    <div class="card"><label>指派新角色：貼 user id 或搜暱稱</label>
      <div class="row"><input id="roleQuery" class="grow" placeholder="user uuid 或 暱稱關鍵字"/>
      <button onclick="searchRoleUser()">搜尋</button></div>
      <div id="roleSearchOut"></div></div>` +
    ((roles&&roles.length)? roles.map(r=>roleCard(r)).join("") : '<p class="empty">還沒有任何管理員/版主</p>');
}
function roleCard(r){
  const boards = roleBoards.map(b=>{
    const on = (r.mod_boards||[]).includes(b.category);
    return `<button class="pill ${on?'ok':''}" onclick="toggleModBoard('${r.id}','${b.category}')">${esc(b.title)}${on?' ✓':''}</button>`;
  }).join(" ");
  return `<div class="card"><div class="row">
      <b>${esc(r.display_name||short(r.id))}</b>
      ${r.is_admin?'<span class="pill warn">管理員</span>':'<span class="pill ok">版主</span>'}
      <span class="muted">${short(r.id)}</span><span class="grow"></span>
      <button onclick="setAdmin('${r.id}',${r.is_admin?'false':'true'})">${r.is_admin?'撤管理員':'升管理員'}</button>
      <button class="danger" onclick="clearRole('${r.id}')">清除角色</button>
    </div>
    <div class="row" style="margin-top:8px"><span class="muted">版主板塊：</span>${boards}</div>
  </div>`;
}
async function searchRoleUser(){
  const q=$("#roleQuery").value.trim(); const out=$("#roleSearchOut");
  if(!q){ out.innerHTML=''; return; }
  let rows=[];
  if(/^[0-9a-f-]{36}$/i.test(q)){
    const { data } = await sb.from("profiles").select("id,display_name,is_admin,mod_boards").eq("id",q);
    rows=data||[];
  }else{
    const { data } = await sb.from("profiles").select("id,display_name,is_admin,mod_boards").ilike("display_name","%"+q+"%").limit(8);
    rows=data||[];
  }
  rows.forEach(r=>roleMap[r.id]={ is_admin:!!r.is_admin, mod_boards:(r.mod_boards||[]) });
  out.innerHTML = rows.length? rows.map(r=>`<div class="row" style="margin-top:8px">
      <b>${esc(r.display_name||"(無暱稱)")}</b><span class="muted">${short(r.id)}</span><span class="grow"></span>
      <button onclick="setAdmin('${r.id}',true)">設管理員</button>
      ${roleBoards.map(b=>`<button onclick="grantMod('${r.id}','${b.category}')">版主·${esc(b.title)}</button>`).join("")}
    </div>`).join("") : '<p class="muted" style="margin-top:8px">找不到用戶（暱稱要完全部分匹配；也可直接貼 uuid）</p>';
}
async function _setRole(uid, admin, boards){
  const { error } = await sb.rpc("admin_set_role",{ target:uid, make_admin:admin, boards:boards });
  if(error){ toast("失敗："+error.message); return; }
  toast("已更新"); loadRoles();
}
function _cur(uid){ return roleMap[uid] || { is_admin:false, mod_boards:[] }; }
async function setAdmin(uid, admin){ _setRole(uid, admin, _cur(uid).mod_boards); }
async function clearRole(uid){ if(confirm("清除這個人的全部角色？")) _setRole(uid, false, []); }
async function grantMod(uid, cat){
  const cur=_cur(uid).mod_boards.slice();
  if(!cur.includes(cat)) cur.push(cat);
  _setRole(uid, _cur(uid).is_admin, cur);
}
async function toggleModBoard(uid, cat){
  const cur=_cur(uid).mod_boards.slice();
  const next = cur.includes(cat) ? cur.filter(x=>x!==cat) : cur.concat([cat]);
  _setRole(uid, _cur(uid).is_admin, next);
}

// stale＝多久沒跑算「太久沒跑」（分鐘）。lol_live 每 3 分跑→門檻收緊；push_sync 只在比賽剛結束才跑→放寬。
const SCRIPTS = [
  { key:"cpbl_sync",      label:"賽程比分同步",      stale:90 },
  { key:"cold_start_bot", label:"賽後暖場留言",      stale:90 },
  { key:"news_sync",      label:"狸聞抓取",          stale:90 },
  { key:"general_sync",   label:"綜合板投稿",        stale:90 },
  { key:"push_sync",      label:"賽後推播",          stale:180 },
  { key:"lol_live",       label:"LoL 主力：建賽程＋即時比分＋逐局英雄KDA＋對位（Riot，每3分）", stale:15 },
  { key:"lol_sync",       label:"LoL 備援：Leaguepedia（只補 Riot 沒涵蓋的場；常被限流屬正常）", stale:90 },
];
async function loadScriptHealth(){
  const el=$("#script-health"); if(!el) return;
  const { data, error } = await sb.from("script_heartbeats").select("*");
  if(error){ el.innerHTML='<span class="muted">讀取失敗：'+esc(error.message)+'</span>'; return; }
  const map={}; (data||[]).forEach(r=>map[r.script]=r);
  const now=Date.now();
  el.innerHTML = SCRIPTS.map(({key:k,label:name,stale:staleMin})=>{
    const r=map[k];
    if(!r) return `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--surface2)">
      <b style="color:var(--text)">${name}</b><span class="grow"></span><span class="pill">尚無紀錄</span></div>`;
    const ageMin=Math.round((now-new Date(r.last_run))/60000);
    const stale=ageMin>staleMin;
    const cls=(!r.ok||stale)?"warn":"ok";
    const status=!r.ok?"⚠️ 上次有錯":stale?"⏰ 太久沒跑":"正常";
    const ago=ageMin<1?"剛剛":ageMin<60?`${ageMin}分前`:`${Math.round(ageMin/60)}小時前`;
    return `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--surface2)">
      <b style="color:var(--text)">${name}</b>
      <span class="muted" style="font-size:12px;white-space:nowrap">${ago}</span>
      <span class="muted grow" style="font-size:11px;overflow:hidden;text-overflow:ellipsis">${esc(r.detail||"")}</span>
      <span class="pill ${cls}" style="white-space:nowrap">${status}</span></div>`;
  }).join("");
}

// ---- 全域告警橫幅（讀 script_heartbeats；把「看門狗」那套判斷＋DeepSeek 中斷/用量告警搬到後台，任何分頁都看得到，免推播）----
const BACKUP_STALE_MIN = 1560;   // 每日備份，超過 26h 沒成功就算告警
async function loadHealthBanner(){
  const el=$("#health-banner"); if(!el) return;
  const { data, error } = await sb.from("script_heartbeats").select("*");
  if(error) return;                                   // 讀不到（未登入/權限）就不顯示，免誤報
  const map={}; (data||[]).forEach(r=>map[r.script]=r);
  const now=Date.now();
  const ageOf=r=>Math.round((now-new Date(r.last_run))/60000);
  const ago=m=>m<1?"剛剛":m<60?`${m}分前`:`${Math.round(m/60)}小時前`;
  const red=[], warn=[];
  SCRIPTS.forEach(({key:k,label:name,stale:staleMin})=>{
    const short=name.split("：")[0];                  // 長標籤只取冒號前短名
    const r=map[k];
    if(!r){ red.push(`${short}：尚無心跳紀錄`); return; }
    const age=ageOf(r), soft=/用量偏高/.test(r.detail||"");
    if(!r.ok){ (soft?warn:red).push(`${short}：${esc(r.detail||"上次執行有錯")}（${ago(age)}）`); }
    else if(soft){ warn.push(`${short}：${esc(r.detail)}（${ago(age)}）`); }
    else if(age>staleMin){ red.push(`${short}：⏰ 太久沒跑（${ago(age)}）`); }
  });
  const b=map["backup"];
  if(!b) red.push("每日備份：尚無紀錄");
  else if(!b.ok) red.push(`每日備份：${esc(b.detail||"失敗")}（${ago(ageOf(b))}）`);
  else if(ageOf(b)>BACKUP_STALE_MIN) red.push(`每日備份：⏰ 超過 26h 沒成功（${ago(ageOf(b))}）`);
  const t=new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
  const base="display:block;margin:10px 16px 0;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.65;";
  if(red.length){
    el.style.cssText=base+"background:rgba(229,84,75,.14);border:1px solid var(--danger);color:#ffd7d4;";
    el.innerHTML=`<b style="color:var(--danger)">🚨 ${red.length} 項告警</b>`
      +red.map(x=>`<div>• ${x}</div>`).join("")
      +warn.map(x=>`<div style="color:var(--brand)">• ${x}</div>`).join("")
      +`<div style="color:var(--sub);font-size:11px;margin-top:4px">最後檢查 ${t}·每分鐘自動刷新</div>`;
  } else if(warn.length){
    el.style.cssText=base+"background:rgba(232,131,58,.14);border:1px solid var(--brand);color:#ffcf9f;";
    el.innerHTML=`<b style="color:var(--brand)">⚠️ ${warn.length} 項提醒</b>`
      +warn.map(x=>`<div>• ${x}</div>`).join("")
      +`<div style="color:var(--sub);font-size:11px;margin-top:4px">最後檢查 ${t}</div>`;
  } else {
    el.style.cssText=base+"background:rgba(63,163,114,.12);border:1px solid rgba(63,163,114,.4);color:var(--ok);";
    el.innerHTML=`✅ 系統正常 · 全部腳本心跳正常、備份最新 <span style="color:var(--sub);font-size:11px">（最後檢查 ${t}）</span>`;
  }
}

async function loadSyncBeat(){

async function loadCats(){
  const { data } = await sb.from("topics").select("category").neq("type","news_container");
  const found=[...new Set((data||[]).map(t=>t.category).filter(c=>c&&c!=="_news"))];
  const order=["棒球","電競","綜合"];
  DT.cats = found.sort((a,b)=>((order.indexOf(a)+1||99)-(order.indexOf(b)+1||99))||a.localeCompare(b));

let _dft=null;
function onDataFilter(){
  clearTimeout(_dft);
  _dft=setTimeout(()=>{
    DT.filters.q=$("#dq")?.value.trim()||"";
    DT.filters.status=$("#dstatus")?.value||"";
    DT.filters.league=$("#dleague")?.value||"";
    fetchTopics();
  }, 250);
}
async function fetchTopics(){
  let q = sb.from("topics").select("*").eq("category",DT.cat).neq("type","news_container")
            .order("starts_at",{ascending:false,nullsFirst:false}).limit(300);
  if(DT.filters.q){
    const like="%"+DT.filters.q.replace(/[,()]/g," ")+"%";
    if(catMeta(DT.cat).kind==='topic') q=q.or(`title.ilike.${like},body.ilike.${like}`);
    else q=q.ilike("title",like);
  }
  if(DT.filters.status) q=q.eq("status",DT.filters.status);
  if(DT.filters.league) q=q.eq("subcategory",DT.filters.league);
  const { data, error } = await q;
  if(error){ $("#data-list").innerHTML='<p class="empty">讀取失敗：'+esc(error.message)+'</p>'; return; }
  DT.topics = data||[];
  if($("#dcount")) $("#dcount").textContent = `${DT.topics.length} 筆`;
  renderDataList();
}
function renderDataList(){
  const el=$("#data-list"); if(!el) return;
  el.innerHTML = DT.topics.length ? DT.topics.map(topicRow).join("") : '<p class="empty">沒有符合條件的資料</p>';
}

  DT.open=topicId; DT.openKind='tcomments'; DT.tOpen=null;

  const list=DT.targets[topicId]||[]; const w=list.find(x=>x.parent_id==null)||list[0];

function toggle(id, kind){

async function saveTopic(id){
  const t = DT.topics.find(x=>x.id===id); if(!t) return;
  const game = isMatch(t), lol = t.type==='lol_match';
  const patch = { title:$("#e_title").value.trim(), category:$("#e_cat").value.trim(),
                  status:$("#e_status").value, starts_at: fromLocalInput($("#e_start").value) };
  if(!patch.title||!patch.category){ toast("標題與分類不能空"); return; }
  if(lol){ patch.subcategory=$("#e_sub").value; patch.subtitle=$("#e_sub2").value.trim()||null; }
  if(game){
    patch.away_short=$("#e_away").value.trim(); patch.home_short=$("#e_home").value.trim();
    patch.away_color=hexColorToInt($("#e_acolor").value); patch.home_color=hexColorToInt($("#e_hcolor").value);
    const as_=$("#e_as").value, hs=$("#e_hs").value;
    patch.away_score = as_===""?null:parseInt(as_,10);
    patch.home_score = hs===""?null:parseInt(hs,10);
    patch.locked = true;                       // 編輯比賽 → 鎖定，避免被自動覆蓋
  } else {
    patch.subtitle=$("#e_sub").value.trim()||null;
    patch.body=$("#e_body").value.trim()||null;
    patch.origin_url=$("#e_link").value.trim()||null;
    patch.cover_url=$("#e_cover").value.trim()||null;
  }
  const { error } = await sb.from("topics").update(patch).eq("id",id);
  if(error){ toast("儲存失敗："+error.message); return; }
  toast(game?"已儲存並鎖定 🔒":"已儲存"); DT.open=null; DT.openKind=null; fetchTopics();
}
async function unlockTopic(id){

  const { error } = await sb.from("topics").update({ locked:false }).eq("id",id);
  if(error){ toast("失敗："+error.message); return; }

}
async function delTopic(id){

async function loadTargets(topicId){

    DT.tSummary[tm.id]={ avg, n, comments:count||0 };

const LOL_POS = { Top:"上", Jungle:"野", Mid:"中", Bot:"AD", Support:"輔" };
function lolTargetsPanel(t, list){
  const sideLabel = s => s==='blue' ? (t.home_short||"主隊") : s==='red' ? (t.away_short||"客隊") : "—";
  const bySide = (a,b)=> (a.side===b.side ? (a.sort_order-b.sort_order) : (a.side==='blue'?-1:1));
  const games = list.filter(x=>x.kind==='game').sort((a,b)=>a.sort_order-b.sort_order);
  const sp    = list.filter(x=>x.kind==='series_player').sort(bySide);
  const playersOf = gid => list.filter(x=>x.kind==='player'&&x.parent_id===gid).sort(bySide);
  const prow = x => {
    const champ = x.champion_icon
      ? `<img src="${esc(x.champion_icon)}" onerror="this.style.display='none'" style="width:22px;height:22px;border-radius:5px;flex:none"/>`
      : `<span style="width:22px;flex:none"></span>`;
    return `<div class="row" style="margin:3px 0 3px 10px;gap:6px;align-items:center;">
      <span class="pill" style="min-width:46px;text-align:center;flex:none">${esc(sideLabel(x.side))}</span>
      <span class="muted" style="width:20px;flex:none">${LOL_POS[x.position]||""}</span>
      ${champ}
      <input class="grow" value="${esc(x.name)}" id="t_n_${x.id}" style="min-width:80px"/>
      <input value="${esc(x.subtitle||"")}" id="t_s_${x.id}" placeholder="KDA・英雄" style="max-width:140px"/>
      <input type="hidden" id="t_c_${x.id}" value="${intToHexColor(x.color_hex)}"/>
      <input type="hidden" id="t_o_${x.id}" value="${x.sort_order}"/>
      <button class="primary" onclick="saveTarget('${x.id}','${t.id}')">存</button>
      <button class="danger" onclick="delTarget('${x.id}','${t.id}')">刪</button>
      <button onclick="toggleTargetInfo('${x.id}','${t.id}')">${DT.tOpen===x.id?'收起':'評分/留言'}</button>
    </div>` + (DT.tOpen===x.id ? targetInfoPanel(x.id) : "");
  };
  return `<div class="card" style="background:var(--surface2);margin-top:10px;">
    <h2>逐局選手（英雄聯盟）</h2>
    ${games.length ? games.map(g=>`<div style="border-top:1px solid var(--surface);padding-top:6px;margin-top:6px;">
        <b>${esc(g.name)}</b> ${g.side?`<span class="pill ok">${esc(sideLabel(g.side))} 勝</span>`:'<span class="muted" style="font-size:12px">（勝負未定/未判定）</span>'}
        ${playersOf(g.id).map(prow).join("") || '<p class="muted" style="margin-left:10px">（本局尚無選手）</p>'}
      </div>`).join("") : '<p class="muted">尚無逐局資料（比賽開打後由 Riot 即時長出）</p>'}
    <h2 style="margin-top:14px">全場選手 · 對位面板</h2>
    ${sp.length ? sp.map(prow).join("") : '<p class="muted">尚無全場選手</p>'}
    <p class="muted" style="margin-top:8px;font-size:12px;">逐局英雄/KDA/勝負由 Riot 即時更新；手動修改會鎖定本場、停止自動覆蓋（可在「編輯」裡解鎖）。</p>
  </div>`;
}
async function saveTarget(id, topicId){
  const patch = { name:$("#t_n_"+id).value.trim(), subtitle:$("#t_s_"+id).value.trim()||null,
                  color_hex:hexColorToInt($("#t_c_"+id).value), sort_order:parseInt($("#t_o_"+id).value||"0",10) };
  if(!patch.name){ toast("名稱不能空"); return; }
  const { error } = await sb.from("rating_targets").update(patch).eq("id",id);
  if(error){ toast("失敗："+error.message); return; }
  toast("已儲存"); await lockParentTopic(topicId); loadTargets(topicId);
}
async function addTarget(topicId, kind, parentId){
  const name = prompt(kind==='player'?"球員名稱：":(kind==='team'?"隊伍名稱：":"標的名稱："));
  if(!name||!name.trim()) return;
  const row = { topic_id:topicId, parent_id:parentId, kind, name:name.trim(), color_hex:0xE8833A, sort_order:99 };
  const { error } = await sb.from("rating_targets").insert(row);
  if(error){ toast("新增失敗："+error.message); return; }
  toast("已新增"); await lockParentTopic(topicId); loadTargets(topicId);
}
async function delTarget(id, topicId){
  const x = (DT.targets[topicId]||[]).find(t=>t.id===id);
  if(!confirm(`刪除「${x?x.name:"此標的"}」？其下球員與相關評分/留言會一併刪除。`)) return;
  const { error } = await sb.from("rating_targets").delete().eq("id",id);
  if(error){ toast("刪除失敗："+error.message); return; }
  toast("已刪除"); await lockParentTopic(topicId); loadTargets(topicId);
}
async function lockParentTopic(topicId){      // 改動標的也鎖定母比賽，避免爬蟲覆蓋
  const t = DT.topics.find(x=>x.id===topicId);
  if(t && isMatch(t) && !t.locked){ await sb.from("topics").update({locked:true}).eq("id",topicId); t.locked=true; }
}
// ---- 某個標的（球員/隊伍/全場）的評分分佈 + 留言（可直接刪）----
function toggleTargetInfo(tid, topicId){
  if(DT.tOpen===tid){ DT.tOpen=null; renderDataList(); return; }
  DT.tOpen=tid;
  if(DT.tInfo[tid]) renderDataList(); else loadTargetInfo(tid);
}
async function loadTargetInfo(tid){
  const [r1, r2] = await Promise.all([
    sb.from("ratings").select("score").eq("target_id", tid).limit(2000),
    sb.from("comments").select("id,user_id,body,score,like_count,created_at,parent_comment_id")
      .eq("target_id", tid).order("like_count",{ascending:false}).limit(300),
  ]);
  const comments = r2.data || [];
  const ids = [...new Set(comments.map(c=>c.user_id))];
  const authors = {};
  if(ids.length){
    const { data:profs } = await sb.from("profiles").select("id,display_name,is_bot").in("id", ids);
    (profs||[]).forEach(p=>authors[p.id]=p);
  }
  DT.tInfo[tid] = { ratings:(r1.data||[]).map(r=>r.score), comments, authors, humanOnly:false };
  if(r1.error||r2.error) toast("讀取部分失敗："+((r1.error||r2.error).message));
  renderDataList();
}
function toggleHumanOnly(tid){ const i=DT.tInfo[tid]; if(i){ i.humanOnly=!i.humanOnly; renderDataList(); } }
async function delTargetComment(cid, tid){
  if(!confirm("刪除這則留言？（含其底下回覆）")) return;
  const { error } = await sb.rpc("admin_delete_comment",{ cid });
  if(error){ toast("刪除失敗："+error.message); return; }
  toast("已刪除"); loadTargetInfo(tid);
}
function targetInfoPanel(tid){
  const info = DT.tInfo[tid];
  if(!info) return `<div class="card" style="background:var(--surface);margin:4px 0 8px 12px;"><p class="muted">載入中…</p></div>`;
  const { ratings, comments, authors, humanOnly } = info;
  const n=ratings.length, avg=n?(ratings.reduce((a,b)=>a+b,0)/n):0;
  const buckets=Array(10).fill(0); ratings.forEach(s=>{ if(s>=1&&s<=10) buckets[s-1]++; });
  const maxB=Math.max(1,...buckets);
  const bars = buckets.map((c,i)=>`<div title="${i+1}分：${c}人" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">
      <div style="width:100%;background:var(--brand);height:${Math.round(c/maxB*44)}px;min-height:1px;border-radius:2px 2px 0 0;"></div>
      <span class="muted" style="font-size:10px">${i+1}</span></div>`).join("");
  let cs = humanOnly ? comments.filter(c=>!(authors[c.user_id]||{}).is_bot) : comments;
  const crow=c=>{ const a=authors[c.user_id]||{};
    const tag=a.is_bot?'<span class="pill">🤖</span>':'<span class="pill ok">真人</span>';
    const reply=c.parent_comment_id?'<span class="muted" style="font-size:11px">↳回覆</span> ':'';
    return `<div class="row" style="padding:5px 0;border-bottom:1px solid var(--surface2);align-items:flex-start;">
      <div class="grow"><div>${reply}${esc(c.body||"（圖片留言）")}</div>
        <div class="muted" style="font-size:11px">${tag} ${esc(a.display_name||short(c.user_id))} · ${c.score!=null?c.score+"分 · ":""}♥${c.like_count||0} · ${new Date(c.created_at).toLocaleDateString()}</div></div>
      <button class="danger" onclick="delTargetComment('${c.id}','${tid}')">刪</button></div>`; };
  return `<div class="card" style="background:var(--surface);margin:4px 0 8px 12px;">
    <div class="row"><b style="color:var(--brand);font-size:18px">${avg.toFixed(1)}</b><span class="muted">分 · ${n} 人評</span>
      <span class="grow"></span>
      <label style="margin:0;font-size:12px;display:flex;gap:4px;align-items:center;cursor:pointer"><input type="checkbox" style="width:auto" ${humanOnly?"checked":""} onchange="toggleHumanOnly('${tid}')"/>只看真人</label></div>
    <div class="row" style="align-items:flex-end;height:52px;gap:2px;margin:6px 0">${bars}</div>
    <div class="muted" style="font-size:12px;margin:8px 0 2px">留言 ${cs.length} 則（依讚數排序）</div>
    ${cs.slice(0,50).map(crow).join("") || '<p class="muted">尚無留言</p>'}
    ${cs.length>50?`<p class="muted" style="font-size:11px">（只顯示前 50 則；要全面搜尋可用「留言審核」分頁）</p>`:""}
  </div>`;
}

// ---- 新增比賽 / 話題 ----
function openNewTopic(){
  const el=$("#data-new"); if(el.innerHTML){ el.innerHTML=""; return; }
  const matchKind = catMeta(DT.cat).kind==='match';
  el.innerHTML = `<div class="card" style="border-color:var(--brand);">
    <h2>新增${matchKind?'比賽':'話題'}（${esc(DT.cat||'')}）</h2>
    <div class="row">
      <div class="grow"><label>類型</label><select id="n_type" onchange="document.getElementById('n_game').style.display=this.value==='cpbl_game'?'block':'none'">
        <option value="cpbl_game"${matchKind?' selected':''}>比賽（兩隊對戰）</option><option value="user_topic"${matchKind?'':' selected'}>一般話題</option></select></div>
      <div class="grow"><label>分類</label><input id="n_cat" value="${esc(DT.cat||'')}" placeholder="棒球 / 影劇…"/></div>
    </div>
    <label>標題</label><input id="n_title" placeholder="客隊 vs 主隊　或　話題名稱"/>
    <div class="row">
      <div class="grow"><label>狀態</label><select id="n_status">
        <option value="upcoming">未開始</option><option value="live">進行中</option><option value="ended">已結束</option></select></div>
      <div class="grow"><label>開始時間</label><input type="datetime-local" id="n_start"/></div>
    </div>
    <div id="n_game" style="display:${matchKind?'block':'none'}">
      <div class="row">
        <div class="grow"><label>客隊簡稱</label><input id="n_away" placeholder="客隊"/></div>
        <div class="grow"><label>主隊簡稱</label><input id="n_home" placeholder="主隊"/></div>
      </div>
      <p class="muted">建立後可在「隊伍 / 球員」裡加球員。</p>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="primary" onclick="createTopic()">建立</button>
      <button class="ghost" onclick="document.getElementById('data-new').innerHTML=''">取消</button>
    </div>
  </div>`;
}
async function createTopic(){
  const type=$("#n_type").value, title=$("#n_title").value.trim(), cat=$("#n_cat").value.trim();
  if(!title||!cat){ toast("請填標題與分類"); return; }
  const game = type==='cpbl_game';
  const home = game?($("#n_home").value.trim()||"主隊"):null, away = game?($("#n_away").value.trim()||"客隊"):null;
  const topic = { type, category:cat, title, status:$("#n_status").value,
    rating_scope: game?"team":"whole", starts_at: fromLocalInput($("#n_start").value),
    home_short:home, away_short:away, home_color: game?0xE8833A:null, away_color: game?0x7FA0B3:null, locked:true };
  const { data, error } = await sb.from("topics").insert(topic).select().single();
  if(error){ toast("建立失敗："+error.message); return; }
  const targets = game
    ? [{topic_id:data.id,parent_id:null,kind:"team",name:home,subtitle:"主場",color_hex:0xE8833A,sort_order:0},
       {topic_id:data.id,parent_id:null,kind:"team",name:away,subtitle:"客隊",color_hex:0x7FA0B3,sort_order:1}]
    : [{topic_id:data.id,parent_id:null,kind:"whole",name:title,subtitle:null,color_hex:0xE8833A,sort_order:0}];
  const { error:e2 } = await sb.from("rating_targets").insert(targets);
  if(e2){ toast("比賽已建，標的失敗："+e2.message); }
  else toast("已建立 ✅");
  $("#data-new").innerHTML=""; await loadCats(); fetchTopics();
}

// ---- 狸聞管理（news：列表/編輯/刪除/手寫）----
const NEWS_CONTAINER = "99999999-9999-4999-8999-999999999999";   // 隱形新聞容器話題（留言標的掛它下面）

async function loadNews(){
  const el=$("#tab-news");
  el.innerHTML = `<h2>狸聞快報 · 自動抓的可改，也能自己寫</h2>
    <div class="row" style="margin-bottom:10px;">
      <button class="primary" onclick="openNewNews()">＋ 寫一則狸聞</button>
      <span class="grow"></span><span class="muted" id="newscount"></span>
    </div>
    <div id="news-new"></div>
    <div id="news-list"><p class="muted">載入中…</p></div>`;
  const { data, error } = await sb.from("news").select("*").order("published_at",{ascending:false}).limit(100);
  if(error){ $("#news-list").innerHTML='<p class="empty">讀取失敗：'+esc(error.message)+'</p>'; return; }
  $("#newscount").textContent = `${data.length} 則`;
  $("#news-list").innerHTML = data.length ? data.map(newsCard).join("") : '<p class="empty">還沒有狸聞</p>';
}
function newsCard(n){
  const src = n.source==="manual" ? '<span class="pill ok">手寫</span>' : '<span class="pill">'+esc(n.origin_source||"自動")+'</span>';
  return `<div class="card">
    <div class="row">${src}<span class="muted">${n.published_at?new Date(n.published_at).toLocaleString():""}</span></div>
    <label>標題</label><input id="nt_${n.id}" value="${esc(n.title)}"/>
    <label>摘要（卡片上的一兩句）</label><input id="ns_${n.id}" value="${esc(n.summary||"")}"/>
    <label>站內短文（內頁正文）</label>
    <textarea id="nb_${n.id}" rows="3" style="width:100%;font:inherit;background:var(--surface2);color:var(--text);border:1px solid #3a322e;border-radius:10px;padding:9px 11px;">${esc(n.body||"")}</textarea>
    <div class="row" style="margin-top:6px;">
      <div class="grow"><label>原文連結（可空）</label><input id="nu_${n.id}" value="${esc(n.origin_url||"")}"/></div>
      <div style="max-width:130px"><label>來源名</label><input id="no_${n.id}" value="${esc(n.origin_source||"")}"/></div>
      <div><label>封面色</label><input type="color" id="nc_${n.id}" value="${intToHexColor(n.color_hex)}" style="padding:2px;height:40px;width:52px"/></div>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="primary" onclick="saveNews('${n.id}')">儲存</button>
      <span class="grow"></span>
      <button class="danger" onclick="delNews('${n.id}','${n.target_id||""}')">刪除</button>
    </div></div>`;
}
async function saveNews(id){
  const patch={ title:$("#nt_"+id).value.trim(), summary:$("#ns_"+id).value.trim()||null,
    body:$("#nb_"+id).value.trim()||null, origin_url:$("#nu_"+id).value.trim(),
    origin_source:$("#no_"+id).value.trim()||null, color_hex:hexColorToInt($("#nc_"+id).value) };
  if(!patch.title){ toast("標題不能空"); return; }
  const { error } = await sb.from("news").update(patch).eq("id",id);
  if(error){ toast("儲存失敗："+error.message); return; }
  toast("已儲存"); loadNews();
}
async function delNews(id, targetId){
  if(!confirm("刪除這則狸聞？底下的留言也會一併刪除。")) return;
  const { error } = await sb.from("news").delete().eq("id",id);
  if(error){ toast("刪除失敗："+error.message); return; }
  if(targetId) await sb.from("rating_targets").delete().eq("id",targetId);   // 連帶清留言標的
  toast("已刪除"); loadNews();
}
function openNewNews(){
  const el=$("#news-new"); if(el.innerHTML){ el.innerHTML=""; return; }
  el.innerHTML = `<div class="card" style="border-color:var(--brand);">
    <h2>寫一則狸聞</h2>
    <label>標題（必填）</label><input id="mn_title" placeholder="例如：評評狸 1.1 上線，新增狸聞快報！"/>
    <label>摘要（卡片上的一兩句，可空）</label><input id="mn_summary"/>
    <label>站內短文（內頁正文，可空）</label>
    <textarea id="mn_body" rows="4" style="width:100%;font:inherit;background:var(--surface2);color:var(--text);border:1px solid #3a322e;border-radius:10px;padding:9px 11px;"></textarea>
    <div class="row" style="margin-top:6px;">
      <div class="grow"><label>原文連結（可空）</label><input id="mn_url" placeholder="https://…"/></div>
      <div style="max-width:120px"><label>來源名</label><input id="mn_src" value="評評狸"/></div>
      <div style="max-width:110px"><label>分類</label><select id="mn_cat"><option>棒球</option><option>綜合</option></select></div>
      <div><label>封面色</label><input type="color" id="mn_color" value="#e8833a" style="padding:2px;height:40px;width:52px"/></div>
    </div>
    <div class="row" style="margin-top:10px;">
      <button class="primary" onclick="createNews()">發佈</button>
      <button class="ghost" onclick="document.getElementById('news-new').innerHTML=''">取消</button>
    </div></div>`;
}
async function createNews(){
  const title=$("#mn_title").value.trim();
  if(!title){ toast("請填標題"); return; }
  // 容器話題（沒建過就補）＋ 留言標的
  await sb.from("topics").upsert({ id:NEWS_CONTAINER, type:"news_container", category:"_news", title:"_news",
    rating_scope:"whole", status:"ended", starts_at:"2000-01-01T00:00:00Z", locked:true }, { onConflict:"id" });
  const { data:tg, error:e1 } = await sb.from("rating_targets")
    .insert({ topic_id:NEWS_CONTAINER, kind:"whole", name:title.slice(0,40), color_hex:15237434, sort_order:0 })
    .select().single();
  if(e1){ toast("建留言標的失敗："+e1.message); return; }
  const { error } = await sb.from("news").insert({
    source:"manual", source_key:"manual-"+Date.now(), category:$("#mn_cat").value,
    title, summary:$("#mn_summary").value.trim()||null, body:$("#mn_body").value.trim()||null,
    origin_url:$("#mn_url").value.trim(), origin_source:$("#mn_src").value.trim()||null,
    color_hex:hexColorToInt($("#mn_color").value), published_at:new Date().toISOString(),
    target_id:tg.id });
  if(error){ toast("發佈失敗："+error.message); return; }
  toast("已發佈 ✅"); $("#news-new").innerHTML=""; loadNews();
}

// ---- 自動沿用既有登入 ----
(async()=>{ const { data:{ session } } = await sb.auth.getSession(); if(session) afterLogin(session.user); })();
</script>
